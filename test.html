<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>校舎内 WebAR 学科紹介</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body { 
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; font-family: sans-serif; 
            background-color: #000000 !important; 
        }
        #ar-container, a-scene {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            z-index: 1 !important; overflow: hidden !important;
        }
        .btn-back {
            position: fixed; top: 20px; left: 20px; z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6); color: #ffffff;
            padding: 10px 18px; border-radius: 20px; text-decoration: none;
            font-weight: bold; font-size: 16px; border: 2px solid #ffffff;
        }
        .floor-selector {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; gap: 6px; background: rgba(0, 0, 0, 0.6);
            padding: 6px; border-radius: 20px; border: 2px solid #ffffff;
        }
        .floor-btn {
            background: transparent; color: white; border: none;
            padding: 8px 12px; border-radius: 12px; font-weight: bold;
            font-size: 14px; cursor: pointer;
        }
        .floor-btn.active { background: #10b981; color: white; }
        .mindar-ui-overlay, .mindar-ui-scanning { display: none !important; }
        .stamp-dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); z-index: 20000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .stamp-dialog-box {
            background: #ffffff; width: 85%; max-width: 340px;
            border-radius: 20px; padding: 24px 20px; text-align: center;
        }
    </style>
</head>
<body>

    <a href="videoMaya.html" class="btn-back">← 戻る</a>

    <div class="floor-selector">
        <button id="btn-1f" class="floor-btn" onclick="switchFloor('1f')">1F</button>
        <button id="btn-2f" class="floor-btn" onclick="switchFloor('2f')">2F</button>
        <button id="btn-3f" class="floor-btn" onclick="switchFloor('3f')">3F</button>
        <button id="btn-4f" class="floor-btn" onclick="switchFloor('4f')">4F</button>
        <button id="btn-5f" class="floor-btn" onclick="switchFloor('5f')">5F</button>
    </div>

    <div id="ar-container"></div>

    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得！</h3>
            <p id="stamp-msg" style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">閉じる</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

    <script>
    const floorData = {
        '1f': { mind: '1f', model: 'kougyo2.glb', video: '', floorText: '1F', modelScale: '0.2 0.2 0.2', modelPos: '0 0.45 0.1' },
        '2f': { mind: '2f', model: 'syokutyou.glb', video: '', floorText: '2F', modelScale: '0.35 0.35 0.35', modelPos: '0 0.7 0.15' },
        '3f': { mind: '3f', model: 'fukude3.glb', video: '', floorText: '3F', modelScale: '0.35 0.35 0.35', modelPos: '0 0.55 0.15' },
        '4f': { mind: '4f', model: 'zyougi2.glb', video: '', floorText: '4F', modelScale: '0.2 0.2 0.2', modelPos: '0 0.55 0.1' },
        '5f': { mind: '5f', model: 'syougyou3.glb', video: '', floorText: '5F', modelScale: '0.5 0.5 0.5', modelPos: '0 0.5 0.1' },

        'denki':     { mind: 'tokei',     model: '', video: 'denki.mp4',     floorText: '電子機械', flag: 'stamp-a-flag', videoWidth: '1.0', videoHeight: '0.56' },
        'jougi':     { mind: 'pc',        model: '', video: 'jgvideo2.mp4',  floorText: '情報技術', flag: 'stamp-b-flag', videoWidth: '1.0', videoHeight: '0.56' },
        'hukude':    { mind: 'hukude',    model: '', video: 'hukude.mp4',    floorText: '服飾デザイン', flag: 'stamp-d-flag', videoWidth: '1.0', videoHeight: '0.56' },
        'syokutyou': { mind: 'syokutyou', model: '', video: 'syokutyou.mp4', floorText: '食物調理', flag: 'stamp-e-flag', videoWidth: '1.0', videoHeight: '0.56' },
        'ryukei':    { mind: 'ryukei',    model: '', video: 'syougyou.mp4',  floorText: '流通経済', flag: 'stamp-f-flag', videoWidth: '1.0', videoHeight: '0.56' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let selectedFloor = (urlParams.get('floor') || '1f').toLowerCase();
    if (!floorData[selectedFloor]) selectedFloor = '1f';

    let currentConfig = floorData[selectedFloor];

    window.addEventListener('DOMContentLoaded', () => {
        updateActiveButton(selectedFloor);
        buildARScene();
    });

    function updateActiveButton(floorPrefix) {
        document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${floorPrefix}`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function buildARScene() {
        const mindFile = currentConfig.mind; 
        const container = document.getElementById('ar-container');
        const hasVideo = Boolean(currentConfig.video);
        const hasModel = Boolean(currentConfig.model);
        
        container.innerHTML = `
        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: ./${mindFile}.mind; autoStart: true; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            ${hasVideo ? `
            <a-assets>
                <video id="ar-video-element" src="${currentConfig.video}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            </a-assets>` : ''}

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity light="type: ambient; color: #ffffff; intensity: 2.5;"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 1"></a-entity>

            <a-entity mindar-image-target="targetIndex: 0" id="target-object">
                ${hasVideo ? `
                <a-video
                    id="floor-video-entity"
                    src="#ar-video-element"
                    position="0 0 0"
                    rotation="0 0 0"
                    width="${currentConfig.videoWidth || '1.0'}"
                    height="${currentConfig.videoHeight || '0.56'}"
                    material="shader: flat; side: double;">
                </a-video>` : ''}

                ${hasModel ? `
                <a-gltf-model
                    src="${currentConfig.model}"
                    position="${currentConfig.modelPos || '0 0 0'}"
                    scale="${currentConfig.modelScale || '1 1 1'}"
                    rotation="0 0 0">
                </a-gltf-model>` : ''}
            </a-entity>
        </a-scene>
        `;

        const sceneEl = document.getElementById('ar-scene');
        sceneEl.addEventListener('render-target-loaded', () => {
            setupTargetEvents();
        });
    }

    function switchFloor(floorPrefix) {
        if (floorPrefix === selectedFloor) return;
        window.location.href = `?floor=${floorPrefix}`;
    }

    let stampTimer = null;

    function setupTargetEvents() {
        const targetObject = document.getElementById('target-object');
        const stampDialog = document.getElementById('stamp-dialog');
        const stampMsg = document.getElementById('stamp-msg');
        const videoNativeEl = document.getElementById('ar-video-element');

        if (targetObject) {
            targetObject.addEventListener('targetFound', () => {
                if (stampTimer) clearTimeout(stampTimer);

                if (videoNativeEl) {
                    videoNativeEl.currentTime = 0;
                    videoNativeEl.play().catch(e => console.log("再生エラー:", e));
                }

                if (currentConfig.flag) {
                    localStorage.setItem(currentConfig.flag, '1');
                }
                localStorage.setItem(`stamp-${currentConfig.floorText}-done`, '1');

                stampTimer = setTimeout(() => {
                    stampMsg.innerHTML = `${currentConfig.floorText} のオブジェクトを検出して<br>ARコンテンツが解放されました！`;
                    stampDialog.style.display = 'flex';
                }, 10000);
            });

            targetObject.addEventListener('targetLost', () => {
                if (stampTimer) {
                    clearTimeout(stampTimer);
                    stampTimer = null;
                }

                if (videoNativeEl) {
                    videoNativeEl.pause();
                }
            });
        }
    }

    function closeStampDialog() {
        document.getElementById('stamp-dialog').style.display = 'none';
    }

    function goToMap() {
        window.location.href = 'map.html';
    }
    </script>
</body>
</html>
