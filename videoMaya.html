<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>越総 ARアプリ</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="Style.css">
    <script src="Script.js?v=10"></script>

    <style>
        /* ログパネル */
        #soft-log-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            color: #333333;
            padding: 14px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            font-family: sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .log-status-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #475569;
            font-weight: bold;
        }

        .log-message {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .btn-to-test {
            display: block;
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button type="button" class="btn-back" onclick="goBack()">← 戻る</button>
    <button type="button" class="btn-collection" onclick="openCollection()">🎬 解放動画</button>

    <div id="ar-container"></div>

    <!-- 案内ログ・移動パネル -->
    <div id="soft-log-panel">
        <div class="log-header">
            <span>📷 マーカー読み取り</span>
            <span id="log-status" class="log-status-badge">スキャン中</span>
        </div>
        <div id="log-message" class="log-message">近くに読み取れるものがあるかも！ボタンを押してみよう</div>
        <a href="test.html" id="btn-to-test" class="btn-to-test" style="display: none;">3D体験画面へ移動 ➔</a>
    </div>

    <!-- 学科選択モーダル -->
    <div id="collection-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 onclick="handleTitleClick()">学科を選択してください</h2>
            <div class="dept-button-group">
                <button class="dept-btn" onclick="selectDepartment('stamp-a')">電子機械科</button>
                <button class="dept-btn" onclick="selectDepartment('stamp-b')">情報技術科</button>
                <button class="dept-btn" onclick="selectDepartment('stamp-f')">流通経済科</button>
                <button class="dept-btn" onclick="selectDepartment('stamp-c')">情報処理科</button>
                <button class="dept-btn" onclick="selectDepartment('stamp-d')">服飾デザイン科</button>
                <button class="dept-btn" onclick="selectDepartment('stamp-e')">食物調理科</button>
            </div>
            <div id="collection-list"></div>
            <div class="modal-footer">
                <button type="button" class="modal-btn close-btn" onclick="closeCollection()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 動画一覧モーダル -->
    <div id="dept-video-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="dept-title">学科動画一覧</h2>
            <div id="dept-video-list"></div>
            <div class="modal-footer">
                <button class="modal-btn back-btn" onclick="closeDeptVideos()">← 学科一覧へ戻る</button>
                <button class="modal-btn close-btn" onclick="closeDeptVideos()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- スタート説明画面 -->
    <div id="explanation-screen">
        <div class="bg-decorations">
            <i class="fa-solid fa-gear decor-item item-1"></i>
            <i class="fa-solid fa-calculator decor-item item-2"></i>
            <i class="fa-solid fa-scissors decor-item item-3"></i>
            <i class="fa-solid fa-utensils decor-item item-4"></i>
            <i class="fa-solid fa-vr-cardboard decor-item item-5"></i>
            <i class="fa-solid fa-graduation-cap decor-item item-6"></i>
        </div>
        <div class="card">
            <h1>— 越総 AR体験 —</h1>
            <p>カメラを校章マーカーに<br>かざしてみよう！<br>学科紹介動画が<br>飛び出すよ</p>
            <div>
                <button type="button" class="start-btn" onclick="startAR()">Next ➔</button>
            </div>
        </div>
    </div>
    
    <div id="near-object-log" class="near-log-container"></div>

</body>
</html>
